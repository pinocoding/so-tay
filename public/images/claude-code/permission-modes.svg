<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Shift+Tab cycles permission modes</title>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d97757"/>
    </marker>
  </defs>
  <rect width="760" height="300" rx="16" fill="#faf9f5"/>
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1f1e1d">Shift+Tab cycles the permission mode</text>

  <text x="40" y="78" font-size="12" fill="#6b6964">less autonomy</text>
  <text x="720" y="78" text-anchor="end" font-size="12" fill="#6b6964">more autonomy</text>
  <line x1="130" y1="74" x2="630" y2="74" stroke="#c9c6bd" stroke-width="2" marker-end="url(#m)"/>

  <g text-anchor="middle">
    <rect x="30" y="100" width="160" height="96" rx="12" fill="#fff" stroke="#d97757" stroke-width="2"/>
    <text x="110" y="128" font-size="15" font-weight="700" fill="#1f1e1d">Plan</text>
    <text x="110" y="150" font-size="12" fill="#6b6964">read-only</text>
    <text x="110" y="168" font-size="12" fill="#6b6964">researches &amp; proposes</text>
    <text x="110" y="186" font-size="12" fill="#6b6964">a plan, no edits</text>

    <rect x="210" y="100" width="160" height="96" rx="12" fill="#fff" stroke="#d97757" stroke-width="2"/>
    <text x="290" y="128" font-size="15" font-weight="700" fill="#1f1e1d">Manual (default)</text>
    <text x="290" y="150" font-size="12" fill="#6b6964">asks before every</text>
    <text x="290" y="168" font-size="12" fill="#6b6964">edit and command</text>

    <rect x="390" y="100" width="160" height="96" rx="12" fill="#fff" stroke="#d97757" stroke-width="2"/>
    <text x="470" y="128" font-size="15" font-weight="700" fill="#1f1e1d">Accept edits</text>
    <text x="470" y="150" font-size="12" fill="#6b6964">file edits approved</text>
    <text x="470" y="168" font-size="12" fill="#6b6964">automatically; asks</text>
    <text x="470" y="186" font-size="12" fill="#6b6964">for risky commands</text>

    <rect x="570" y="100" width="160" height="96" rx="12" fill="#fff" stroke="#d97757" stroke-width="2"/>
    <text x="650" y="128" font-size="15" font-weight="700" fill="#1f1e1d">Auto</text>
    <text x="650" y="150" font-size="12" fill="#6b6964">a classifier reviews</text>
    <text x="650" y="168" font-size="12" fill="#6b6964">each action instead</text>
    <text x="650" y="186" font-size="12" fill="#6b6964">of asking you</text>
  </g>

  <rect x="250" y="226" width="260" height="44" rx="22" fill="#1f1e1d"/>
  <text x="380" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">⇧ Shift + Tab  →  next mode</text>
  <text x="380" y="288" text-anchor="middle" font-size="11" fill="#6b6964">The exact order and which modes appear depend on your version and settings.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
