<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Where Claude Code runs</title>
  <rect width="760" height="470" rx="16" fill="#faf9f5"/>
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1f1e1d">Where Claude Code runs</text>

  <!-- groups -->
  <g font-size="13" font-weight="700" fill="#6b6964">
    <text x="40" y="78">SURFACES</text>
    <text x="560" y="78">WORK FROM ANYWHERE</text>
    <text x="40" y="396">INTEGRATIONS</text>
  </g>

  <!-- center engine -->
  <rect x="290" y="190" width="180" height="80" rx="14" fill="#d97757"/>
  <text x="380" y="224" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Claude Code</text>
  <text x="380" y="246" text-anchor="middle" font-size="12" fill="#fff">same agentic engine</text>

  <g stroke="#c9c6bd" stroke-width="2">
    <line x1="200" y1="112" x2="300" y2="196"/>
    <line x1="200" y1="172" x2="290" y2="214"/>
    <line x1="200" y1="232" x2="290" y2="232"/>
    <line x1="200" y1="292" x2="290" y2="250"/>
    <line x1="200" y1="352" x2="300" y2="268"/>
    <line x1="560" y1="112" x2="460" y2="196"/>
    <line x1="560" y1="172" x2="470" y2="214"/>
    <line x1="560" y1="232" x2="470" y2="232"/>
    <line x1="560" y1="292" x2="470" y2="250"/>
    <line x1="200" y1="426" x2="330" y2="270"/>
  </g>

  <g font-size="14" font-weight="600" fill="#1f1e1d">
    <!-- surfaces -->
    <rect x="40" y="90" width="160" height="44" rx="10" fill="#fff" stroke="#c9c6bd"/>
    <text x="56" y="117">⌨  CLI (terminal)</text>
    <rect x="40" y="150" width="160" height="44" rx="10" fill="#fff" stroke="#c9c6bd"/>
    <text x="56" y="177">🖥  Desktop app</text>
    <rect x="40" y="210" width="160" height="44" rx="10" fill="#fff" stroke="#c9c6bd"/>
    <text x="56" y="237">{ } Editor (IDE)</text>
    <rect x="40" y="270" width="160" height="44" rx="10" fill="#fff" stroke="#c9c6bd"/>
    <text x="56" y="297">☁  Web (cloud)</text>
    <rect x="40" y="330" width="160" height="44" rx="10" fill="#fff" stroke="#c9c6bd"/>
    <text x="56" y="357">📱 Mobile app</text>

    <!-- anywhere -->
    <rect x="560" y="90" width="170" height="44" rx="10" fill="#fff" stroke="#c9c6bd"/>
    <text x="576" y="117">Remote Control</text>
    <rect x="560" y="150" width="170" height="44" rx="10" fill="#fff" stroke="#c9c6bd"/>
    <text x="576" y="177">Teleport &amp; Handoff</text>
    <rect x="560" y="210" width="170" height="44" rx="10" fill="#fff" stroke="#c9c6bd"/>
    <text x="576" y="237">Dispatch</text>
    <rect x="560" y="270" width="170" height="44" rx="10" fill="#fff" stroke="#c9c6bd"/>
    <text x="576" y="297">Channels</text>

    <!-- integrations -->
    <rect x="40" y="404" width="160" height="44" rx="10" fill="#fff" stroke="#c9c6bd"/>
    <text x="56" y="431">Slack · Chrome</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
