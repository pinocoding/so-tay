<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>The agentic loop, explained like a car mechanic</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d97757"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2f7d4f"/>
    </marker>
  </defs>
  <rect width="760" height="540" rx="16" fill="#faf9f5"/>
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1f1e1d">Think of Claude as a car mechanic</text>

  <!-- request -->
  <rect x="230" y="58" width="300" height="54" rx="27" fill="#1f1e1d"/>
  <text x="380" y="81" text-anchor="middle" font-size="13" fill="#c9c6bd">You say:</text>
  <text x="380" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">"My car makes a strange noise."</text>
  <path d="M380 112 V138" stroke="#d97757" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <!-- steps: icon, mechanic action, Claude term -->
  <g text-anchor="middle">
    <rect x="270" y="142" width="220" height="86" rx="14" fill="#fff" stroke="#d97757" stroke-width="2"/>
    <g stroke="#1f1e1d" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="377" cy="162" r="8"/><path d="M383 168 L390 175"/></g>
    <text x="380" y="198" font-size="16" font-weight="700" fill="#1f1e1d">1 · Look at the car</text>
    <text x="380" y="218" font-size="12" fill="#d97757">= Gather context</text>

    <rect x="516" y="258" width="220" height="86" rx="14" fill="#fff" stroke="#d97757" stroke-width="2"/>
    <g stroke="#1f1e1d" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M620 285 Q615 279 617 274 Q620 267 626 267 Q632 267 635 274 Q637 279 632 285 Z"/><path d="M621 289 H631 M623 293 H629"/></g>
    <text x="626" y="314" font-size="16" font-weight="700" fill="#1f1e1d">2 · Find what's broken</text>
    <text x="626" y="334" font-size="12" fill="#d97757">= Plan</text>

    <rect x="270" y="374" width="220" height="86" rx="14" fill="#fff" stroke="#d97757" stroke-width="2"/>
    <g stroke="#1f1e1d" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M371 407 L382 396"/><path d="M382 396 A7 7 0 1 0 388 384 L384 390 L386 394 L390 392 Z"/></g>
    <text x="380" y="430" font-size="16" font-weight="700" fill="#1f1e1d">3 · Fix it</text>
    <text x="380" y="450" font-size="12" fill="#d97757">= Act</text>

    <rect x="24" y="258" width="220" height="86" rx="14" fill="#fff" stroke="#d97757" stroke-width="2"/>
    <g stroke="#1f1e1d" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M120 286 V279 L125 278 L129 271 H139 L143 278 L148 279 V286 Z"/><circle cx="127" cy="287" r="3.2" fill="#fff"/><circle cx="141" cy="287" r="3.2" fill="#fff"/></g>
    <text x="134" y="314" font-size="16" font-weight="700" fill="#1f1e1d">4 · Test drive</text>
    <text x="134" y="334" font-size="12" fill="#d97757">= Verify</text>
  </g>

  <!-- loop arrows -->
  <g stroke="#d97757" stroke-width="2.5" fill="none">
    <path d="M490 185 Q620 185 626 252" marker-end="url(#a)"/>
    <path d="M626 344 Q620 417 496 417" marker-end="url(#a)"/>
    <path d="M270 417 Q140 417 134 350" marker-end="url(#a)"/>
    <path d="M134 258 Q140 185 264 185" marker-end="url(#a)"/>
  </g>
  <text x="168" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#d97757">Still noisy?</text>
  <text x="168" y="167" text-anchor="middle" font-size="13" fill="#d97757">look again</text>

  <!-- done -->
  <path d="M64 344 Q64 496 266 496" stroke="#2f7d4f" stroke-width="2.5" fill="none" marker-end="url(#g)"/>
  <text x="102" y="432" font-size="13" font-weight="600" fill="#2f7d4f">All good!</text>
  <rect x="272" y="474" width="216" height="44" rx="22" fill="#e6f2ea" stroke="#2f7d4f" stroke-width="2"/>
  <text x="380" y="501" text-anchor="middle" font-size="15" font-weight="700" fill="#2f7d4f">✓ "Your car is ready!"</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
